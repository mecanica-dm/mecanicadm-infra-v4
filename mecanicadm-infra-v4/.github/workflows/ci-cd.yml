name: CI/CD - Terraform EKS + Kubernetes

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: prod

    env:
      TF_WORKSPACE: prod

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Ensure S3 backend exists
        run: |
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
          fi
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$BUCKET" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "aws:kms"
                },
                "BucketKeyEnabled": true
              }]
            }'

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="key=terraform/mecanicadm-k8s/terraform.tfstate"

      - name: Terraform Format
        run: terraform fmt -check -diff

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan-prod

      - name: Terraform Apply
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan-prod

      - name: Terraform Outputs
        if: github.ref == 'refs/heads/main'
        run: terraform output

      - name: Atualiza o kubeconfig do EKS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER_NAME || 'mecanicadm-prod' }} \
            --region ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Aplica os manifests dos add-ons
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f k8s/addons/metrics-server/components.yaml

          if [ "$(terraform output -raw external_dns_enabled)" = "true" ]; then
            kubectl apply -f k8s/addons/external-dns/external-dns.yaml
          fi

          kubectl apply -f k8s/addons/kong/kong.yaml

      - name: Aguarda os add-ons ficarem prontos
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=5m

          kubectl -n kong rollout status deployment/ingress-kong --timeout=10m

          if [ "$(terraform output -raw external_dns_enabled)" = "true" ]; then
            kubectl -n external-dns rollout status deployment/external-dns --timeout=5m
          fi

      - name: Verifica a injeção do IRSA no ExternalDNS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          if [ "$(terraform output -raw external_dns_enabled)" != "true" ]; then
            echo "ExternalDNS desabilitado (external_dns_enabled=false); nada a verificar."
            exit 0
          fi
          ROLE_ARN=$(kubectl get pod -n external-dns -l app.kubernetes.io/name=external-dns \
            -o jsonpath='{.items[0].spec.containers[0].env[?(@.name=="AWS_ROLE_ARN")].value}')
          echo "ExternalDNS IRSA (pod): ${ROLE_ARN:-NAO INJETADO}"
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::IRSA nao foi injetado no ExternalDNS. Verifique o webhook de identidade do cluster."
            exit 1
          fi
